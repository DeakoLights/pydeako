[project]
name = "pydeako"
version = "0.6.0"
authors = [
  { name="Deako", email="software@deako.com" },
]
description = "Connect and interact with deako devices over the network locally"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zeroconf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
"Homepage" = "https://github.com/DeakoLights/pydeako"
"Bug Tracker" = "https://github.com/DeakoLights/pydeako"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Test bodies are still type checked, but test functions need no annotations.
module = [
    "pydeako.deako.test_deako",
    "pydeako.deako.test_manager",
    "pydeako.deako.utils.test_connection",
    "pydeako.deako.utils.test_socket",
    "pydeako.discover.test_address_pool",
    "pydeako.discover.test_discover",
    "pydeako.models.test_request",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
